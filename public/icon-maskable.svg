<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background (nessun rx — Android applica la propria maschera) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Wave centrata nella safe zone (10% padding = 51px per lato) -->
  <!-- Ridotta leggermente rispetto all'icon.svg per stare nella safe zone -->
  <polyline
    points="400,256 340,256 294,390 218,122 172,256 112,256"
    fill="none"
    stroke="white"
    stroke-width="30"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
